<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>היי עדן</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f7f7fb;
      }

      button {
        font-size: 1.2rem;
        padding: 0.8rem 1.6rem;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: #4f46e5;
        color: white;
      }

      #message {
        margin-top: 1rem;
        font-size: 1.4rem;
      }
    </style>
  </head>
  <body>
    <main>
      <button id="sayHiButton" type="button">לחץ כאן</button>
      <p id="message" aria-live="polite"></p>
    </main>

    <script>
      const button = document.getElementById('sayHiButton');
      const message = document.getElementById('message');

      button.addEventListener('click', () => {
        message.textContent = 'היי עדן';
      });
    </script>
  </body>
</html>
